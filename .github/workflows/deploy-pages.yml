name: Deploy web preview (GitHub Pages)

# Publishes a static export of the web app to GitHub Pages as a UI preview:
# the landing page (with brand art) renders fully; app screens are client
# shells since Pages hosts no backend.
on:
  push:
    branches: [claude/storyme-mvp-design-build-foiqb9, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter './packages/*' build
      - name: Static-export the web app
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE_URL: https://api.storyme.app
        run: pnpm --filter @storyme/web build
      # Publish to the classic gh-pages branch: the Actions token cannot create
      # a Pages site via the API (admin-only), but serving from gh-pages needs
      # only a branch push (auto-enabled on public personal repos).
      - name: Publish out/ to gh-pages branch
        run: |
          cd apps/web/out
          touch .nojekyll   # keep _next/* (Jekyll drops underscore paths)
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy web preview (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
