name: Deploy web preview (GitHub Pages)

# Publishes a static export of the web app to GitHub Pages as a UI preview:
# the landing page (with brand art) renders fully; app screens are client
# shells since Pages hosts no backend.
on:
  push:
    branches: [claude/storyme-mvp-design-build-foiqb9, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter './packages/*' build
      - name: Static-export the web app
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE_URL: https://api.storyme.app
        run: pnpm --filter @storyme/web build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
